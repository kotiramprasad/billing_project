<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bill Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #80c4e7;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(238, 3, 3, 0.1);
        }
        h1 {
            text-align: center;
            color: #add91c;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #b26def;
            border-radius: 5px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        table th {
            background-color: #f0f0f0;
        }
        .total {
            text-align: right;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shopping Bill Generator</h1>
        <form id="shopping-form">
            <label for="name">Your Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="number">Mobile Number:</label>
            <input type="tel" id="number" placeholder="Enter your mobile number" required>

            <label for="item">Select Item:</label>
            <select id="item">
                <option value="apple" data-price="12">Apple - ₹12</option>
                <option value="sampoo" data-price="80">Shampoo - ₹80</option>
                <option value="books" data-price="20">Books - ₹20</option>
                <option value="idly ravva" data-price="80">Idly Ravva - ₹80</option>
                <option value="rice" data-price="900">Rice - ₹900</option>
                <option value="oil" data-price="180">Oil - ₹180</option>
                <option value="saop set" data-price="70">Soap Set - ₹70</option>
                <option value="choclates pack" data-price="100">Chocolates Pack - ₹100</option>
            </select>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" placeholder="Enter quantity" min="1" required>

            <button type="button" onclick="addItem()">Add to Bill</button>
        </form>

        <table id="bill-table">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Amount (₹)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Items will be dynamically added here -->
            </tbody>
        </table>

        <div class="total" id="total-price">Total: ₹0</div>
    </div>

    <script>
        let totalPrice = 0;

        function addItem() {
            const itemSelect = document.getElementById('item');
            const itemName = itemSelect.options[itemSelect.selectedIndex].text.split(' - ')[0];
            const itemPrice = parseInt(itemSelect.options[itemSelect.selectedIndex].getAttribute('data-price'));
            const quantity = parseInt(document.getElementById('quantity').value);

            if (!quantity || quantity <= 0) {
                alert('Please enter a valid quantity.');
                return;
            }

            const amount = itemPrice * quantity;
            totalPrice += amount;

            const tableBody = document.getElementById('bill-table').querySelector('tbody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${itemName}</td>
                <td>${quantity}</td>
                <td>₹${amount}</td>
            `;
            tableBody.appendChild(row);

            document.getElementById('total-price').innerText = `Total: ₹${totalPrice}`;

            document.getElementById('quantity').value = '';
        }
    </script>
</body>
</html>
