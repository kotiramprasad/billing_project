<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bill Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        .summary {
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shopping Bill Generator</h1>
        <form id="shopping-form">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="mobile">Mobile Number:</label>
            <input type="text" id="mobile" placeholder="Enter your mobile number" required>

            <label for="item">Item:</label>
            <select id="item">
                <option value="apple" data-price="50">Apple - ₹50</option>
                <option value="banana" data-price="20">Banana - ₹20</option>
                <option value="orange" data-price="30">Orange - ₹30</option>
            </select>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" placeholder="Enter quantity" min="1" required>

            <button type="button" onclick="addItem()">Add to Bill</button>
        </form>

        <table id="bill-table">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Price per Unit</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="summary" id="total-price">Total: ₹0</div>
        <div class="summary" id="gst">GST (18%): ₹0</div>
        <div class="summary" id="final-price">Final Price: ₹0</div>

        <button onclick="proceedToSummary()">Proceed to Summary</button>
    </div>

    <script>
        let bill = [];
        let totalPrice = 0;

        function addItem() {
            const itemSelect = document.getElementById('item');
            const itemName = itemSelect.options[itemSelect.selectedIndex].text.split(' - ')[0];
            const itemPrice = parseInt(itemSelect.options[itemSelect.selectedIndex].getAttribute('data-price'));
            const quantity = parseInt(document.getElementById('quantity').value);

            if (!quantity || quantity <= 0) {
                alert('Please enter a valid quantity');
                return;
            }

            const amount = itemPrice * quantity;
            totalPrice += amount;

            bill.push({ itemName, itemPrice, quantity, amount });

            const tableBody = document.getElementById('bill-table').querySelector('tbody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${itemName}</td>
                <td>₹${itemPrice}</td>
                <td>${quantity}</td>
                <td>₹${amount}</td>
            `;
            tableBody.appendChild(row);

            const gst = totalPrice * 0.18;
            const finalPrice = totalPrice + gst;

            document.getElementById('total-price').innerText = `Total: ₹${totalPrice}`;
            document.getElementById('gst').innerText = `GST (18%): ₹${gst.toFixed(2)}`;
            document.getElementById('final-price').innerText = `Final Price: ₹${finalPrice.toFixed(2)}`;

            document.getElementById('quantity').value = '';
        }

        function proceedToSummary() {
            localStorage.setItem('bill', JSON.stringify(bill));
            localStorage.setItem('totalPrice', totalPrice);
            const gst = totalPrice * 0.18;
            localStorage.setItem('gst', gst);
            const finalPrice = totalPrice + gst;
            localStorage.setItem('finalPrice', finalPrice);
            window.location.href = 'summary.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        .summary {
            font-weight: bold;
            text-align: right;
        }

</head>
<body>
    <div class="container">
        <h1>Bill Summary</h1>
        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Price per Unit</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="summary-table"></tbody>
        </table>
        <div class="summary" id="total-price"></div>
        <div class="summary" id="gst"></div>
        <div class="summary" id="final-price"></div>
    </div>

    <script>
        const bill = JSON.parse(localStorage.getItem('bill'));
        const totalPrice = localStorage.getItem('totalPrice');
        const gst = localStorage.getItem('gst');
        const finalPrice = localStorage.getItem('finalPrice');

        const tableBody = document.getElementById('summary-table');
        bill.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.itemName}</td>
                <td>₹${item.itemPrice}</td>
                <td>${item.quantity}</td>
                <td>₹${item.amount}</td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('total-price').innerText = `Total: ₹${totalPrice}`;
        document.getElementById('gst').innerText = `GST (18%): ₹${parseFloat(gst).toFixed(2)}`;
        document.getElementById('final-price').innerText = `Final Price: ₹${parseFloat(finalPrice).toFixed(2)}`;
    </script>
</body>
</html>
